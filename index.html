<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeLorean TV - En Vivo</title>
  <style>
    :root {
      --tv-bezel: #18181b;
      --tv-frame: #09090b;
      --led-on: #22c55e;
      --led-off: #ef4444;
      --accent-cyan: #06b6d4;
      --accent-pink: #ec4899;
      --tv-width: 780px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
      padding: 12px 20px;
      color: #f8fafc;
      transition: background 0.8s ease;
    }

    /* MODO NOCHE */
    body.night-mode {
      background: 
        radial-gradient(circle at 38% 48%, rgba(6, 182, 212, 0.24) 0%, rgba(236, 72, 153, 0.12) 38%, rgba(9, 13, 24, 0.92) 72%),
        url('https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat fixed;
    }

    /* MODO DÍA */
    body.day-mode {
      background: 
        radial-gradient(circle at 38% 45%, rgba(255, 251, 235, 0.22) 0%, rgba(30, 41, 59, 0.48) 75%),
        url('https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat fixed;
    }

    /* Barra superior compacta */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 8px;
      z-index: 20;
    }

    .header-brand, .theme-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(9, 9, 11, 0.84);
      backdrop-filter: blur(10px);
      padding: 6px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #f8fafc;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
    }

    .brand-title {
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #22d3ee, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      font-size: 0.95rem;
    }

    .theme-toggle {
      cursor: pointer;
      font-weight: 600;
      font-size: 0.82rem;
      transition: all 0.2s ease;
    }

    .theme-toggle:hover {
      border-color: var(--accent-cyan);
    }

    .live-dot {
      width: 9px;
      height: 9px;
      background: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 10px #ef4444;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    /* CONTENEDOR PRINCIPAL: TV a la izquierda + Control a la derecha (sin scroll) */
    .living-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      width: 100%;
      max-width: 1480px;
      margin: 0 auto;
    }

    /* Zona del Televisor Redimensionable */
    .tv-wrapper {
      width: var(--tv-width);
      max-width: 100%;
      min-width: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: width 0.15s ease-out;
    }

    /* Chasis Televisor LCD */
    .tv-chassis {
      width: 100%;
      background: linear-gradient(145deg, #27272a, #09090b);
      padding: 14px 14px 20px 14px;
      border-radius: 14px;
      border: 2px solid #27272a;
      position: relative;
      transition: box-shadow 0.8s ease;
    }

    body.night-mode .tv-chassis {
      box-shadow: 
        0 20px 55px rgba(0, 0, 0, 0.90),
        0 0 80px rgba(6, 182, 212, 0.22),
        0 0 35px rgba(236, 72, 153, 0.14),
        inset 0 1px 1px rgba(255, 255, 255, 0.15);
    }

    body.day-mode .tv-chassis {
      box-shadow: 
        0 18px 40px rgba(0, 0, 0, 0.55),
        inset 0 1px 1px rgba(255, 255, 255, 0.25);
    }

    /* Tirador de esquina para agrandar/achicar arrastrando */
    .resize-handle {
      position: absolute;
      right: 4px;
      bottom: 4px;
      width: 18px;
      height: 18px;
      cursor: nwse-resize;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #71717a;
      font-size: 12px;
      user-select: none;
      z-index: 15;
    }

    .resize-handle:hover {
      color: var(--accent-cyan);
    }

    /* Pantalla 16:9 */
    .tv-screen {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.9);
    }

    body.day-mode .tv-screen::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(125deg, rgba(255, 255, 255, 0.06) 0%, transparent 45%);
      pointer-events: none;
      z-index: 4;
    }

    .tv-screen iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .tv-off-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, #18181b 0%, #000000 100%);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: #52525b;
      z-index: 5;
    }

    .tv-off-overlay.active {
      display: flex;
    }

    /* OSD Banner */
    .tv-osd {
      position: absolute;
      top: 14px;
      right: 16px;
      background: rgba(9, 9, 11, 0.9);
      border-left: 4px solid var(--accent-cyan);
      padding: 8px 14px;
      border-radius: 6px;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-8px);
      transition: all 0.3s ease;
      z-index: 6;
    }

    .tv-osd.show {
      opacity: 1;
      transform: translateY(0);
    }

    .osd-ch-num {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--accent-cyan);
    }

    .osd-ch-name {
      font-size: 0.85rem;
      color: #e4e4e7;
    }

    /* Barra inferior del marco LCD */
    .tv-bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding: 0 10px;
    }

    .tv-brand-logo {
      font-size: 0.8rem;
      letter-spacing: 4px;
      font-weight: 800;
      color: #a1a1aa;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(6, 182, 212, 0.35);
    }

    .tv-status-led {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--led-on);
      box-shadow: 0 0 8px var(--led-on);
      transition: 0.3s;
    }

    .tv-status-led.off {
      background: var(--led-off);
      box-shadow: 0 0 8px var(--led-off);
    }

    /* Pedestal compacto */
    .tv-stand-neck {
      width: 90px;
      height: 24px;
      background: linear-gradient(90deg, #18181b, #3f3f46, #18181b);
    }

    .tv-stand-base {
      width: 240px;
      height: 10px;
      background: linear-gradient(180deg, #3f3f46, #18181b);
      border-radius: 6px 6px 2px 2px;
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.85);
    }

    /* CONTROL REMOTO LATERAL COMPACTO (Siempre visible sin hacer scroll) */
    .remote-panel {
      width: 360px;
      flex-shrink: 0;
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: calc(100vh - 70px);
      transition: background 0.8s ease;
    }

    body.night-mode .remote-panel {
      background: rgba(15, 23, 42, 0.88);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.65);
    }

    body.day-mode .remote-panel {
      background: rgba(24, 24, 27, 0.85);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
    }

    /* Fila superior del control: Power + Zapping + Pantalla Completa */
    .remote-top-actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 6px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 8px 10px;
      font-weight: 600;
      font-size: 0.8rem;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .btn-power {
      background: #dc2626;
      color: white;
    }
    .btn-power:hover { background: #b91c1c; }

    .btn-nav {
      background: #27272a;
      color: #f4f4f5;
      border: 1px solid #3f3f46;
    }
    .btn-nav:hover {
      background: #3f3f46;
      border-color: var(--accent-cyan);
    }

    /* Botón de sonido (para quitar el mute inicial del navegador) */
    .btn-unmute {
      background: linear-gradient(90deg, #0891b2, #0284c7);
      color: #fff;
      width: 100%;
      padding: 8px;
      font-size: 0.82rem;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .btn-unmute.unmuted {
      background: rgba(34, 197, 94, 0.2);
      border-color: #22c55e;
      color: #86efac;
    }

    /* Control deslizante para agrandar/achicar TV */
    .size-control-box {
      background: rgba(9, 9, 11, 0.55);
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .size-label-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #cbd5e1;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent-cyan);
      cursor: pointer;
    }

    .now-playing-bar {
      font-size: 0.78rem;
      color: #38bdf8;
      text-align: center;
      background: rgba(6, 182, 212, 0.1);
      padding: 5px 8px;
      border-radius: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Grilla compacta de 2 columnas dentro del control lateral */
    .channel-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      overflow-y: auto;
      padding-right: 2px;
    }

    /* Scrollbar sutil solo dentro de la botonera si hay muchos canales */
    .channel-grid::-webkit-scrollbar {
      width: 4px;
    }
    .channel-grid::-webkit-scrollbar-thumb {
      background: #3f3f46;
      border-radius: 4px;
    }

    .ch-btn {
      background: rgba(39, 39, 42, 0.88);
      color: #e4e4e7;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 7px 8px;
      text-align: left;
      justify-content: flex-start;
      border-radius: 8px;
      gap: 6px;
    }

    .ch-btn:hover {
      background: rgba(63, 63, 70, 0.98);
      border-color: rgba(6, 182, 212, 0.5);
    }

    .ch-btn.active {
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.28), rgba(236, 72, 153, 0.18));
      border-color: var(--accent-cyan);
      color: #fff;
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.25);
    }

    .ch-badge {
      background: #09090b;
      color: var(--accent-cyan);
      padding: 2px 5px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .ch-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 0.76rem;
    }

    /* En celulares o pantallas angostas se apila de forma compacta */
    @media (max-width: 960px) {
      .living-stage {
        flex-direction: column;
        gap: 12px;
      }
      .tv-wrapper {
        width: 100% !important;
      }
      .remote-panel {
        width: 100%;
        max-height: none;
      }
    }
  </style>
</head>
<body class="night-mode">

  <div class="top-bar">
    <div class="header-brand">
      <span class="live-dot"></span>
      <span class="brand-title">DeLorean TV</span>
    </div>

    <button class="theme-toggle" id="themeToggleBtn" onclick="toggleLivingTheme()">
      ☀️ Modo Día
    </button>
  </div>

  <div class="living-stage">
    <!-- TELEVISOR LCD REDIMENSIONABLE -->
    <div class="tv-wrapper" id="tvWrapper">
      <div class="tv-chassis" id="tvChassis">
        <div class="tv-screen" id="tvScreen">
          <div class="tv-osd" id="tvOsd">
            <div class="osd-ch-num" id="osdNum">CH 01</div>
            <div class="osd-ch-name" id="osdName">Cargando...</div>
          </div>

          <div class="tv-off-overlay" id="tvOffOverlay">
            <p style="letter-spacing: 2px; font-size: 0.9rem;">SIN SEÑAL / TV APAGADO</p>
          </div>

          <iframe 
            id="tvPlayer"
            src="" 
            title="DeLorean TV Player"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            allowfullscreen>
          </iframe>
        </div>

        <div class="tv-bottom-bar">
          <div style="width: 16px;"></div>
          <div class="tv-brand-logo">DELOREAN TV</div>
          <div class="tv-status-led" id="tvLed" title="Estado de energía"></div>
        </div>

        <!-- Tirador para agrandar arrastrando con el mouse -->
        <div class="resize-handle" id="resizeHandle" title="Arrastra para agrandar o achicar la TV">◢</div>
      </div>

      <div class="tv-stand-neck"></div>
      <div class="tv-stand-base"></div>
    </div>

    <!-- CONTROL REMOTO SIEMPRE VISIBLE A UN COSTADO -->
    <div class="remote-panel">
      <div class="remote-top-actions">
        <button class="btn-power" onclick="togglePower()" title="Encender/Apagar">⏻</button>
        <button class="btn-nav" onclick="prevChannel()" title="Canal Anterior">◀ CH-</button>
        <button class="btn-nav" onclick="nextChannel()" title="Canal Siguiente">CH+ ▶</button>
        <button class="btn-nav" onclick="toggleFullScreen()" title="Pantalla Completa">⛶ Full</button>
      </div>

      <!-- Botón para activar sonido al instante (necesario por política de autoplay del navegador) -->
      <button class="btn-unmute" id="unmuteBtn" onclick="enableAudio()">
        🔇 Toca aquí para activar el sonido
      </button>

      <!-- Control deslizante de tamaño del TV -->
      <div class="size-control-box">
        <div class="size-label-row">
          <span>📐 Tamaño de la TV</span>
          <span id="sizePercentText">780px</span>
        </div>
        <input type="range" id="tvSizeSlider" min="420" max="1060" value="780" oninput="setTvSize(this.value)">
      </div>

      <div class="now-playing-bar" id="currentStatusText">
        Sintonizando...
      </div>

      <!-- Grilla compacta de botones -->
      <div class="channel-grid" id="channelGrid"></div>
    </div>
  </div>

  <script>
    const channels = [
      // TVN (3 Señales)
     { num: "01", name: "TVN S", type: "TV", videoId: "lJZvdyIbJqw" },
     // { num: "02", name: "TVN 24 Horas", channelId: "UCTXNz3gjAypWp3EhlIATEJQ" },
      //{ num: "03", name: "TVN Señal 3 (NTV)", channelId: "UC3L3i9f_H6h-e9hQ0wK7P1w" },
         { num: "01", name: "TVN S", type: "TV", videoId: "lJZvdyIbJqw" },

      // MEGA (3 Señales)
      //{ num: "04", name: "Mega Señal 1", channelId: "UCEpId-QgFQuZySRWyokok4Q" },
      { num: "05", name: "Meganoticias", channelId: "UCkccyEbqhhM3uKOI6Shm-4Q" },
      //{ num: "06", name: "Mega 2", channelId: "UCw5v2yQ8A6zP-h9X0s3gQ2A" },

      // CANAL 13 (4 Señales)
      //{ num: "07", name: "Canal 13", channelId: "UCd4D3LfXC_9MY2zSv_3gMgw" },
      { num: "08", name: "T13 En Vivo", channelId: "UCsRnhjcUCR78Q3Ud6OXCTNg" },
      //{ num: "09", name: "13C Cultura", channelId: "UC62f30f2C9s9tB7n6oX5k6w" },
      //{ num: "10", name: "REC TV", channelId: "UCu4X7l2S9K5w5z_n_7p2jQg" },

      // CHILEVISIÓN (2 Señales)
      { num: "11", name: "Chilevisión", channelId: "UC8EdTmyUaFIfZvVttJ9lgIA" },
      //{ num: "12", name: "CHV Noticias", channelId: "UCRsUoZYC1ULUspipMRnMhwg" },

      // RADIOS Y SEÑALES EXTRA
      { num: "17", name: "Señal Extra", videoId: "lJZvdyIbJqw" },
      { num: "17", name: "Señal Extra", videoId: "lJZvdyIbJqw" },
    { num: "17", name: "Señal Extra", videoId: "lJZvdyIbJqw" }
     // { num: "17", name: "Señal Extra", videoId: "lJZvdyIbJqw" }
    ];

    let currentIndex = 0;
    let isTvOn = true;
    let isDayMode = false;
    let isAudioUnlocked = false; // Inicia en mute=1 para garantizar autoplay inmediato al cargar
    let osdTimeout;

    const player = document.getElementById("tvPlayer");
    const grid = document.getElementById("channelGrid");
    const osd = document.getElementById("tvOsd");
    const osdNum = document.getElementById("osdNum");
    const osdName = document.getElementById("osdName");
    const statusText = document.getElementById("currentStatusText");
    const offOverlay = document.getElementById("tvOffOverlay");
    const tvLed = document.getElementById("tvLed");
    const themeBtn = document.getElementById("themeToggleBtn");
    const unmuteBtn = document.getElementById("unmuteBtn");
    const tvWrapper = document.getElementById("tvWrapper");
    const sizeSlider = document.getElementById("tvSizeSlider");
    const sizePercentText = document.getElementById("sizePercentText");

    function initThemeByTime() {
      const hour = new Date().getHours();
      isDayMode = hour >= 7 && hour < 20;
      applyTheme();
    }

    function applyTheme() {
      if (isDayMode) {
        document.body.classList.remove("night-mode");
        document.body.classList.add("day-mode");
        themeBtn.innerHTML = "🌙 Modo Noche";
      } else {
        document.body.classList.remove("day-mode");
        document.body.classList.add("night-mode");
        themeBtn.innerHTML = "☀️ Modo Día";
      }
    }

    function toggleLivingTheme() {
      isDayMode = !isDayMode;
      applyTheme();
    }

    function renderButtons() {
      grid.innerHTML = "";
      channels.forEach((ch, index) => {
        const btn = document.createElement("button");
        btn.className = `ch-btn ${index === currentIndex && isTvOn ? "active" : ""}`;
        btn.innerHTML = `
          <span class="ch-badge">${ch.num}</span>
          <span class="ch-name" title="${ch.name}">${ch.name}</span>
        `;
        btn.onclick = () => {
          // Al hacer clic en un canal ya hubo interacción del usuario, desbloqueamos audio
          if (!isAudioUnlocked) {
            isAudioUnlocked = true;
            updateUnmuteButton();
          }
          selectChannel(index);
        };
        grid.appendChild(btn);
      });
    }

    function updateUnmuteButton() {
      if (isAudioUnlocked) {
        unmuteBtn.classList.add("unmuted");
        unmuteBtn.innerHTML = "🔊 Sonido Activado";
      } else {
        unmuteBtn.classList.remove("unmuted");
        unmuteBtn.innerHTML = "🔇 Toca aquí para activar el sonido";
      }
    }

    function enableAudio() {
      isAudioUnlocked = true;
      updateUnmuteButton();
      selectChannel(currentIndex);
    }

    function showOSD(ch) {
      osdNum.textContent = `CH ${ch.num}`;
      osdName.textContent = ch.name;
      osd.classList.add("show");
      clearTimeout(osdTimeout);
      osdTimeout = setTimeout(() => {
        osd.classList.remove("show");
      }, 3000);
    }

    function selectChannel(index) {
      if (!isTvOn) {
        isTvOn = true;
        offOverlay.classList.remove("active");
        tvLed.classList.remove("off");
      }

      currentIndex = index;
      const ch = channels[currentIndex];
      const muteParam = isAudioUnlocked ? "0" : "1";

      if (ch.videoId) {
        player.src = `https://www.youtube.com/embed/${ch.videoId}?autoplay=1&mute=${muteParam}&playsinline=1&rel=0&modestbranding=1`;
      } else {
        player.src = `https://www.youtube.com/embed/live_stream?channel=${ch.channelId}&autoplay=1&mute=${muteParam}&playsinline=1&rel=0&modestbranding=1`;
      }

      statusText.textContent = `CH ${ch.num} • ${ch.name}`;
      showOSD(ch);
      renderButtons();
    }

    function nextChannel() {
      if (!isAudioUnlocked) { isAudioUnlocked = true; updateUnmuteButton(); }
      selectChannel((currentIndex + 1) % channels.length);
    }

    function prevChannel() {
      if (!isAudioUnlocked) { isAudioUnlocked = true; updateUnmuteButton(); }
      selectChannel((currentIndex - 1 + channels.length) % channels.length);
    }

    function togglePower() {
      isTvOn = !isTvOn;
      if (isTvOn) {
        offOverlay.classList.remove("active");
        tvLed.classList.remove("off");
        selectChannel(currentIndex);
      } else {
        player.src = "";
        offOverlay.classList.add("active");
        tvLed.classList.add("off");
        osd.classList.remove("show");
        statusText.textContent = "TV Apagado";
        renderButtons();
      }
    }

    function toggleFullScreen() {
      const screenEl = document.getElementById("tvScreen");
      if (!document.fullscreenElement) {
        screenEl.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    }

    // Cambiar tamaño del televisor con el slider
    function setTvSize(px) {
      tvWrapper.style.width = px + "px";
      sizePercentText.textContent = px + "px";
      sizeSlider.value = px;
    }

    // Arrastrar esquina inferior derecha del marco TV para redimensionar libremente
    const resizeHandle = document.getElementById("resizeHandle");
    let isResizing = false;

    resizeHandle.addEventListener("mousedown", (e) => {
      isResizing = true;
      e.preventDefault();
    });

    window.addEventListener("mousemove", (e) => {
      if (!isResizing) return;
      const rect = tvWrapper.getBoundingClientRect();
      const newWidth = Math.min(1080, Math.max(380, Math.round(e.clientX - rect.left)));
      setTvSize(newWidth);
    });

    window.addEventListener("mouseup", () => {
      isResizing = false;
    });

    // Zapping con flechas del teclado
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "ArrowUp") nextChannel();
      if (e.key === "ArrowLeft" || e.key === "ArrowDown") prevChannel();
    });

    initThemeByTime();
    selectChannel(0);
  </script>
</body>
</html>
