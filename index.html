<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeLorean TV - En Vivo</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --accent-cyan: #06b6d4;
      --accent-pink: #ec4899;
      --led-on: #22c55e;
      --led-off: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background: #07090e;
      color: #f8fafc;
      display: flex;
      padding: 8px;
      gap: 10px;
    }

    .tv-chassis {
      flex: 1;
      height: 100%;
      background: linear-gradient(145deg, #222226, #09090b);
      padding: 8px 8px 12px 8px;
      border-radius: 10px;
      border: 1px solid #27272a;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }

    /* Marco de pantalla que recorta los bordes superior e inferior de YouTube */
    .tv-screen {
      position: relative;
      flex: 1;
      width: 100%;
      background: #000;
      border-radius: 6px;
      overflow: hidden;
    }

    /* Capa transparente sobre el video para evitar hover de YouTube */
    .tv-clean-shield {
      position: absolute;
      inset: 0;
      z-index: 3;
      background: transparent;
    }

    /* Recorte limpio arriba y abajo para ocultar título y barra roja */
    .tv-screen iframe {
      position: absolute;
      top: -62px;
      left: -2%;
      width: 104%;
      height: calc(100% + 124px);
      border: none;
      display: block;
      pointer-events: none;
    }

    .tv-screen video {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      object-fit: contain;
      background: #000;
    }

    .tv-off-overlay {
      position: absolute;
      inset: 0;
      background: #000;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 6px;
      color: #71717a;
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      z-index: 5;
      text-align: center;
      padding: 16px;
    }

    .tv-off-overlay.active { display: flex; }

    /* OSD Banner discreto */
    .tv-osd {
      position: absolute;
      top: 12px;
      right: 14px;
      background: rgba(9, 9, 11, 0.88);
      border-left: 3px solid var(--accent-cyan);
      padding: 6px 12px;
      border-radius: 5px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
      z-index: 6;
    }

    .tv-osd.show { opacity: 1; }
    .osd-ch-num { font-size: 1rem; font-weight: 800; color: var(--accent-cyan); }
    .osd-ch-name { font-size: 0.8rem; color: #e4e4e7; }

    /* Botón flotante de Pantalla Completa */
    .tv-floating-fs {
      position: absolute;
      bottom: 10px;
      right: 10px;
      z-index: 7;
      background: rgba(9, 9, 11, 0.72);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      padding: 5px 9px;
      font-size: 0.72rem;
      cursor: pointer;
      opacity: 0.65;
      transition: all 0.2s ease;
    }

    .tv-floating-fs:hover {
      opacity: 1;
      border-color: var(--accent-cyan);
      background: rgba(9, 9, 11, 0.95);
    }

    .tv-bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px 0 8px;
    }

    .tv-brand-logo {
      font-size: 0.72rem;
      letter-spacing: 3px;
      font-weight: 800;
      background: linear-gradient(90deg, #22d3ee, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .tv-status-led {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--led-on);
      box-shadow: 0 0 6px var(--led-on);
    }

    .tv-status-led.off {
      background: var(--led-off);
      box-shadow: 0 0 6px var(--led-off);
    }

    .remote-panel {
      width: 245px;
      height: 100%;
      flex-shrink: 0;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .remote-top-actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 5px;
      padding: 5px 6px;
      font-weight: 600;
      font-size: 0.7rem;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-power { background: #dc2626; color: #fff; }
    .btn-power:hover { background: #b91c1c; }

    .btn-nav {
      background: #27272a;
      color: #f4f4f5;
      border: 1px solid #3f3f46;
    }
    .btn-nav:hover { background: #3f3f46; border-color: var(--accent-cyan); }

    .btn-unmute {
      background: linear-gradient(90deg, #0891b2, #0284c7);
      color: #fff;
      width: 100%;
      padding: 5px;
      font-size: 0.7rem;
    }
    .btn-unmute.unmuted {
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid #22c55e;
      color: #86efac;
    }

    .now-playing-bar {
      font-size: 0.7rem;
      color: #38bdf8;
      text-align: center;
      background: rgba(6, 182, 212, 0.12);
      padding: 4px 6px;
      border-radius: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .channel-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      overflow-y: auto;
      align-content: start;
      padding-right: 2px;
    }

    .channel-grid::-webkit-scrollbar { width: 3px; }
    .channel-grid::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }

    .ch-btn {
      background: rgba(39, 39, 42, 0.9);
      color: #e4e4e7;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 4px 5px;
      justify-content: flex-start;
      border-radius: 5px;
      gap: 4px;
      height: 26px;
    }

    .ch-btn:hover {
      background: rgba(63, 63, 70, 0.98);
      border-color: rgba(6, 182, 212, 0.5);
    }

    .ch-btn.active {
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.3), rgba(236, 72, 153, 0.2));
      border-color: var(--accent-cyan);
      color: #fff;
    }

    .ch-badge {
      background: #09090b;
      color: var(--accent-cyan);
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 0.62rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .ch-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 0.67rem;
    }

    @media (max-width: 680px) {
      body { flex-direction: column; padding: 4px; }
      .remote-panel { width: 100%; height: 165px; }
    }
  </style>
</head>
<body>

  <div class="tv-chassis">
    <div class="tv-screen" id="tvScreen">
      <div class="tv-osd" id="tvOsd">
        <div class="osd-ch-num" id="osdNum">CH 01</div>
        <div class="osd-ch-name" id="osdName">TVN</div>
      </div>

      <div class="tv-off-overlay" id="tvOffOverlay">SIN SEÑAL / TV APAGADO</div>

      <div class="tv-clean-shield" id="tvShield" ondblclick="toggleFullScreen()"></div>

      <button class="tv-floating-fs" onclick="toggleFullScreen()" title="Agrandar pantalla completa">⛶ Pantalla Completa</button>

      <iframe 
        id="tvPlayer"
        src="" 
        title="DeLorean TV"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        allowfullscreen>
      </iframe>

      <video id="hlsPlayer" playsinline style="display: none;"></video>
    </div>

    <div class="tv-bottom-bar">
      <span style="width: 10px;"></span>
      <span class="tv-brand-logo">DELOREAN TV</span>
      <span class="tv-status-led" id="tvLed"></span>
    </div>
  </div>

  <div class="remote-panel">
    <div class="remote-top-actions">
      <button class="btn-power" onclick="togglePower()" title="Encender/Apagar">⏻</button>
      <button class="btn-nav" onclick="prevChannel()" title="Anterior">◀ CH-</button>
      <button class="btn-nav" onclick="nextChannel()" title="Siguiente">CH+ ▶</button>
      <button class="btn-nav" onclick="toggleFullScreen()" title="Pantalla Completa">⛶</button>
    </div>

    <button class="btn-unmute" id="unmuteBtn" onclick="enableAudio()">
      🔇 Activar Sonido
    </button>

    <div class="now-playing-bar" id="currentStatusText">Sintonizando...</div>

    <div class="channel-grid" id="channelGrid"></div>
  </div>

  <script>
    const channels = [
      { num: "01", name: "24 HORAS", channelId: "UCTXNz3gjAypWp3EhlIATEJQ" },
      { num: "02", name: "TVN", channelId: "UCaVaCaiG6qRzDiJDuEGKOhQ" },
      { num: "03", name: "CANAL 13", videoId: "EoXTa5HBm1M" },
      { num: "04", name: "T13 VIVO", channelId: "UCsRnhjcUCR78Q3Ud6OXCTNg" },
      { num: "05", name: "MEGANOTICIAS", channelId: "UCkccyEbqhhM3uKOI6Shm-4Q" },
      { num: "06", name: "CHV", videoId: "jnCW702_qfo" },
      { num: "07", name: "SERIES", videoId: "fTi3aTD7JxM" },
      { num: "08", name: "CINE", videoId: "oR3zVZsUR5g" }
    ];

    let currentIndex = 0;
    let isTvOn = true;
    let isAudioUnlocked = false;
    let osdTimeout;
    let hlsInstance = null;

    const ytPlayer = document.getElementById("tvPlayer");
    const hlsVideo = document.getElementById("hlsPlayer");
    const tvShield = document.getElementById("tvShield");
    const grid = document.getElementById("channelGrid");
    const osd = document.getElementById("tvOsd");
    const osdNum = document.getElementById("osdNum");
    const osdName = document.getElementById("osdName");
    const statusText = document.getElementById("currentStatusText");
    const offOverlay = document.getElementById("tvOffOverlay");
    const tvLed = document.getElementById("tvLed");
    const unmuteBtn = document.getElementById("unmuteBtn");

    function renderButtons() {
      grid.innerHTML = "";
      channels.forEach((ch, index) => {
        const btn = document.createElement("button");
        btn.className = `ch-btn ${index === currentIndex && isTvOn ? "active" : ""}`;
        btn.innerHTML = `<span class="ch-badge">${ch.num}</span><span class="ch-name" title="${ch.name}">${ch.name}</span>`;
        btn.onclick = () => {
          if (!isAudioUnlocked) { isAudioUnlocked = true; updateUnmuteButton(); }
          selectChannel(index);
        };
        grid.appendChild(btn);
      });
    }

    function updateUnmuteButton() {
      if (isAudioUnlocked) {
        unmuteBtn.classList.add("unmuted");
        unmuteBtn.innerHTML = "🔊 Sonido Activo";
        hlsVideo.muted = false;
      } else {
        unmuteBtn.classList.remove("unmuted");
        unmuteBtn.innerHTML = "🔇 Activar Sonido";
        hlsVideo.muted = true;
      }
    }

    function enableAudio() {
      isAudioUnlocked = true;
      updateUnmuteButton();
      if (hlsVideo.style.display === "block") {
        hlsVideo.muted = false;
        hlsVideo.play().catch(() => {});
      } else {
        selectChannel(currentIndex);
      }
    }

    function showOSD(ch) {
      osdNum.textContent = `CH ${ch.num}`;
      osdName.textContent = ch.name;
      osd.classList.add("show");
      clearTimeout(osdTimeout);
      osdTimeout = setTimeout(() => osd.classList.remove("show"), 2500);
    }

    function stopHls() {
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
      hlsVideo.pause();
      hlsVideo.removeAttribute("src");
      hlsVideo.style.display = "none";
    }

    function playHlsStream(url) {
      ytPlayer.src = "";
      ytPlayer.style.display = "none";
      hlsVideo.style.display = "block";
      hlsVideo.muted = !isAudioUnlocked;

      if (Hls.isSupported()) {
        if (hlsInstance) hlsInstance.destroy();
        hlsInstance = new Hls();
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(hlsVideo);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          hlsVideo.play().catch(() => {});
        });
        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            offOverlay.innerHTML = "SEÑAL HLS NO DISPONIBLE";
            offOverlay.classList.add("active");
          }
        });
      } else if (hlsVideo.canPlayType("application/vnd.apple.mpegurl")) {
        hlsVideo.src = url;
        hlsVideo.play().catch(() => {});
      }
    }

    function selectChannel(index) {
      isTvOn = true;
      offOverlay.innerHTML = "SIN SEÑAL / TV APAGADO";
      offOverlay.classList.remove("active");
      tvLed.classList.remove("off");
      tvShield.style.display = "block";

      currentIndex = index;
      const ch = channels[currentIndex];
      const muteParam = isAudioUnlocked ? "0" : "1";

      if (ch.hlsUrl) {
        playHlsStream(ch.hlsUrl);
      } else {
        stopHls();
        ytPlayer.style.display = "block";
        const cleanParams = `autoplay=1&mute=${muteParam}&controls=0&disablekb=1&iv_load_policy=3&fs=0&playsinline=1&rel=0&modestbranding=1`;
        if (ch.videoId) {
          ytPlayer.src = `https://www.youtube.com/embed/${ch.videoId}?${cleanParams}`;
        } else {
          ytPlayer.src = `https://www.youtube.com/embed/live_stream?channel=${ch.channelId}&${cleanParams}`;
        }
      }

      statusText.textContent = `CH ${ch.num} • ${ch.name}`;
      showOSD(ch);
      renderButtons();
    }

    function nextChannel() {
      if (!isAudioUnlocked) { isAudioUnlocked = true; updateUnmuteButton(); }
      selectChannel((currentIndex + 1) % channels.length);
    }

    function prevChannel() {
      if (!isAudioUnlocked) { isAudioUnlocked = true; updateUnmuteButton(); }
      selectChannel((currentIndex - 1 + channels.length) % channels.length);
    }

    function togglePower() {
      isTvOn = !isTvOn;
      if (isTvOn) {
        selectChannel(currentIndex);
      } else {
        ytPlayer.src = "";
        stopHls();
        tvShield.style.display = "none";
        offOverlay.innerHTML = "SIN SEÑAL / TV APAGADO";
        offOverlay.classList.add("active");
        tvLed.classList.add("off");
        osd.classList.remove("show");
        statusText.textContent = "TV Apagado";
        renderButtons();
      }
    }

    function toggleFullScreen() {
      const screenEl = document.getElementById("tvScreen");
      if (!document.fullscreenElement) {
        screenEl.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "ArrowUp") nextChannel();
      if (e.key === "ArrowLeft" || e.key === "ArrowDown") prevChannel();
    });

    selectChannel(0);
  </script>
</body>
</html>
